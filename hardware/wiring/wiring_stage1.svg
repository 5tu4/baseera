<text x="220" y="379" text-anchor="end" class="pinlab light">GND</text>
<text x="30" y="484" class="small">its own transistor drives the motor: IN high = vibrate</text>
<text x="30" y="498" class="small">solder the wires onto the 3 header pins (or cut them short first)</text>
<text x="30" y="530" class="title">On the XIAO</text>
<text x="30" y="546" class="small">Pads are counted from the USB-C end. Seen from the back, the left</text>
<text x="30" y="560" class="small">edge is 5V, GND, 3V3, D10, D9, D8, D7 and the right edge D0 to D6.</text>
<text x="30" y="574" class="small">BAT− is the battery pad nearer the USB-C: confirm it with the</text>
<text x="30" y="588" class="small">beep test on page 2 before the battery goes on.</text>
<text x="870" y="292" class="title">TP4056 USB-C charger, 6 pads</text>
