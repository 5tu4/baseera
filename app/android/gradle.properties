# Sized for a 16 GB PC whose C: (and so the Windows page file) is nearly full:
# 8 GB here plus a separate Kotlin daemon ran Windows out of memory
# ("The paging file is too small"). 3 GB is plenty for this app.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Compile Kotlin inside the Gradle process instead of starting another JVM.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
kotlin.incremental=false
